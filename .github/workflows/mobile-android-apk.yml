name: Android debug APK (mobile beta)

on:
  push:
    branches:
      - feature/mobile-capacitor-scaffold-20261022
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Assemble unsigned-development Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JDK 21 for Capacitor 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Validate app source and generate mobile bundle
        working-directory: mobile
        run: npm test

      - name: Generate Android native project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: po-grafiku-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
