name: Deploy support notifications

# Intentionally manual. Do not deploy live support code on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-po-grafiku-support
  cancel-in-progress: false

jobs:
  deploy-support:
    name: Test and deploy pvz2-support
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed main branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run isolated support tests
        run: deno test --allow-env tests/support.test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check for configured Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN. Add it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy support function (keep existing custom authentication)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy pvz2-support --project-ref vyavhynnybsinkiievbu --no-verify-jwt
