name: Login button regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'login.html'
      - 'tests/login-button.test.cjs'
      - '.github/workflows/login-button.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/login-button.test.cjs
